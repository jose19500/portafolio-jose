<section id="skills" class="skills section light-background">
  <div class="container section-title" data-aos="fade-up">
    <h2>Habilidades</h2>
    <p>Mis competencias técnicas en desarrollo web y diseño multimedia</p>
  </div>

  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="row skills-content skills-animation">
      <div class="col-lg-6">
        @for (skill of skillsLeft; track skill.name) {
          <div class="progress">
            <span class="skill"><span>{{ skill.name }}</span> <i class="val">{{ skill.value }}%</i></span>
            <div class="progress-bar-wrap">
              <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="skill.value" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        }
      </div>
      <div class="col-lg-6">
        @for (skill of skillsRight; track skill.name) {
          <div class="progress">
            <span class="skill"><span>{{ skill.name }}</span> <i class="val">{{ skill.value }}%</i></span>
            <div class="progress-bar-wrap">
              <div class="progress-bar" role="progressbar" [attr.aria-valuenow]="skill.value" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
