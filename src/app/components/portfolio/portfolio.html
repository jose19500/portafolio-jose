<section id="portfolio" class="portfolio section light-background">
  <div class="container section-title" data-aos="fade-up">
    <h2>Portafolio</h2>
    <p>Una muestra de mis proyectos más destacados en desarrollo web, diseño y multimedia.</p>
  </div>

  <div class="container">
    <div class="isotope-layout" data-default-filter="*" data-layout="masonry" data-sort="original-order">
      <ul class="portfolio-filters isotope-filters" data-aos="fade-up" data-aos-delay="100">
        @for (f of filters; track f.filter) {
          <li [attr.data-filter]="f.filter" [class.filter-active]="f.active" (click)="setFilter(f.filter)">{{ f.label }}</li>
        }
      </ul>

      <div class="row gy-4 isotope-container" data-aos="fade-up" data-aos-delay="200">
        @for (item of portfolioItems; track item.title) {
          <div class="col-lg-4 col-md-6 portfolio-item isotope-item" [ngClass]="item.category">
            <div class="portfolio-content h-100">
              <img [src]="item.img" class="img-fluid" [alt]="item.title">
              <div class="portfolio-info">
                <h4>{{ item.title }}</h4>
                <p>{{ item.desc }}</p>
                <a [href]="item.img" [title]="item.title" data-gallery="portfolio-gallery" class="glightbox preview-link"><i class="bi bi-zoom-in"></i></a>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
