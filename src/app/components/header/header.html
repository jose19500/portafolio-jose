<header id="header" class="header dark-background d-flex flex-column" [class.header-show]="menuOpen">
  <i class="header-toggle d-xl-none bi" [ngClass]="menuOpen ? 'bi-x' : 'bi-list'" (click)="toggleMenu()"></i>

  <div class="profile-img">
    <img src="assets/img/profile-3.jpg" alt="Jose Gabriel Parraga Alvarez" class="img-fluid rounded-circle">
  </div>

  <a href="#hero" class="logo d-flex align-items-center justify-content-center">
    <h1 class="sitename">Jose Gabriel Parraga</h1>
  </a>

  <div class="social-links text-center">
    <a href="#" class="twitter"><i class="bi bi-twitter-x"></i></a>
    <a href="#" class="facebook"><i class="bi bi-facebook"></i></a>
    <a href="https://instagram.com/jose_19500?xtok=a2c1Y2l3Z2UxZ244" target="_blank" class="instagram"><i class="bi bi-instagram"></i></a>
    <a href="mailto:jose19200500627183@gmail.com" class="google-plus"><i class="bi bi-envelope"></i></a>
    <a href="#" class="linkedin"><i class="bi bi-linkedin"></i></a>
    <a href="#" class="github"><i class="bi bi-github"></i></a>
  </div>

  <nav id="navmenu" class="navmenu">
    <ul>
      @for (item of navItems; track item.label) {
        <li>
          <a [href]="item.link" [class.active]="item.active" (click)="closeMenu()">
            <i class="bi navicon" [ngClass]="item.icon"></i>{{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
